name: Daily NBA Props Report

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        run: python main.py --init-db

      - name: Run pipeline (grade yesterday + predict today)
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u main.py

      - name: Commit bets ledger
        continue-on-error: true
        run: |
          git config user.name "NBA Props Bot"
          git config user.email "bot@nba-props.local"
          git add bets_ledger.json
          git diff --staged --quiet || git commit -m "Update bets ledger $(date +%Y-%m-%d)"
          git push || sleep 5 && git push || echo "⚠️ Ledger push failed — will retry next run"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 90
